    <rect stroke="none" fill="#ffffff" x="-60.282" y="-552.0438" width="483.00897" height="922.46326" />
    <text x="0.0" y="9.393976" xml:space="preserve" textLength="15.599574" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">23.</text>
    <text x="18.054005" y="9.393976" xml:space="preserve" textLength="328.95526" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Razporeditev elektronov v atomu elementa A je 2, 7, v atomu elementa B pa 1.</text>
    <text x="18.054005" y="23.31998" xml:space="preserve" textLength="186.04402" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Elementa reagirata, pri tem nastane spojina.</text>
    <text x="0.0" y="50.445984" xml:space="preserve" textLength="15.595444" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">23.</text>
    <text x="18.050024" y="50.445984" xml:space="preserve" textLength="10.9102745" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">a)</text>
    <text x="36.156044" y="50.445984" xml:space="preserve" textLength="325.31918" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Katera vrsta kemijske vezi nastane med atomoma elementov A in B? Obkroži.</text>
    <text x="36.156044" y="77.573166" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="54.206062" y="77.573166" xml:space="preserve" textLength="130.96065" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Med atomoma vez ne nastane.</text>
    <text x="36.146713" y="101.40306" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="54.196735" y="101.40306" xml:space="preserve" textLength="113.35393" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Nepolarna kovalentna vez.</text>
    <text x="36.14672" y="125.23296" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="54.196735" y="125.23296" xml:space="preserve" textLength="102.37555" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Polarna kovalentna vez.</text>
    <text x="36.146713" y="149.06287" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="54.196735" y="149.06287" xml:space="preserve" textLength="49.875557" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Ionska vez.</text>
    <text x="349.6422" y="172.82028" xml:space="preserve" textLength="38.95593" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
    <text x="-0.018663788" y="201.79541" xml:space="preserve" textLength="26.51505" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">23. b)</text>
    <text x="36.137375" y="201.79541" xml:space="preserve" textLength="303.95712" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Napiši formulo molekule nastale spojine, ki vključuje tudi nevezne elektrone.</text>
    <text x="349.656" y="281.512" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
</svg>