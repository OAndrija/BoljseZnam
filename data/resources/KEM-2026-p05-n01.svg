    <text x="266.27103" y="9.393976" xml:space="preserve" textLength="76.39157" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">-COOH? Obkroži.</text>
    <text x="18.054005" y="36.519947" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
