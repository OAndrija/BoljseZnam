    <text x="18.04468" y="84.10723" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.094704" y="84.10723" xml:space="preserve" textLength="124.73552" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Spojina je karboksilna kislina.</text>
    <text x="18.035328" y="107.9371" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
