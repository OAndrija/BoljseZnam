    <text x="0.0" y="9.393976" xml:space="preserve" textLength="10.397572" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">5.</text>
    <text x="18.054005" y="9.393976" xml:space="preserve" textLength="365.42407" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Elementa A in B sta v isti periodi periodnega sistema. Element A ima kovinske lastnosti,</text>
    <text x="18.054005" y="23.254017" xml:space="preserve" textLength="368.90533" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">element B pa nekovinske lastnosti. Element A gori s svetlečim belim plamenom, element</text>
    <text x="18.054005" y="37.17992" xml:space="preserve" textLength="329.86536" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B pa je rumeno zelen strupen plin. Elementa tvorita ionsko spojino s formulo AB</text>
    <text x="347.97302" y="38.829987" xml:space="preserve" textLength="3.3176408" lengthAdjust="spacingAndGlyphs" style="font-size: 6.9498px;">2</text>
    <text x="351.28802" y="37.17999" xml:space="preserve" textLength="32.282776" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">. Kateri</text>
    <text x="18.053253" y="51.105892" xml:space="preserve" textLength="181.88144" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">zapis pravilno ponazarja formulo spojine AB</text>
    <text x="199.97101" y="52.756023" xml:space="preserve" textLength="3.3176408" lengthAdjust="spacingAndGlyphs" style="font-size: 6.9498px;">2</text>
