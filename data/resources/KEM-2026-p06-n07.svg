    <text x="0.0" y="9.39401" xml:space="preserve" textLength="10.397572" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">7.</text>
    <text x="18.054005" y="9.39401" xml:space="preserve" textLength="117.44658" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Kaj prikazuje graf? Obkroži.</text>
    <text x="18.053745" y="284.62103" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="36.103767" y="284.62103" xml:space="preserve" textLength="348.62488" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Odvisnost vrelišča ogljikovodikov od števila ogljikovih atomov v molekulah ogljikovodikov.</text>
    <text x="18.044407" y="306.26483" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="36.09443" y="306.26483" xml:space="preserve" textLength="334.08395" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Odvisnost vrelišča alkoholov od števila ogljikovih atomov v molekulah alkoholov.</text>
    <text x="18.035063" y="327.8482" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.085087" y="327.8482" xml:space="preserve" textLength="351.3221" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Odvisnost vrelišča kisikovih organskih spojin od vrste funkcionalne skupine v spojini.</text>
    <text x="18.016443" y="349.492" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="36.066467" y="349.492" xml:space="preserve" textLength="346.1703" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Odvisnost števila ogljikovih atomov v molekulah ogljikovodikov od njihovega vrelišča.</text>
    <text x="349.656" y="371.14" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
