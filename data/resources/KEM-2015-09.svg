<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6135881708251 165.66002708911947" >
    <rect stroke="none" fill="#ffffff" x="-59.30538" y="-323.49844" width="503.34097" height="922.46326" />
    <text x="0.0" y="9.393976" xml:space="preserve" textLength="10.397572" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">9.</text>
    <text x="18.054005" y="9.393976" xml:space="preserve" textLength="340.86984" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">V formuli molekule alkohola so zaporedno vezani štirje ogljikovi atomi. Na drugem</text>
    <text x="18.054005" y="23.320013" xml:space="preserve" textLength="322.66965" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">ogljikovem atomu je vezana hidroksilna skupina. Kako imenujemo ta alkohol?</text>
    <text x="18.054005" y="37.24592" xml:space="preserve" textLength="168.39531" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Obkroži črko pred pravilnim odgovorom.</text>
    <text x="18.054005" y="64.37199" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="36.104027" y="64.37199" xml:space="preserve" textLength="54.05674" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Propan-1-ol.</text>
    <text x="18.054005" y="88.12941" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="36.104027" y="88.12941" xml:space="preserve" textLength="54.05674" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Propan-2-ol.</text>
    <text x="18.054005" y="111.95931" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.104027" y="111.95931" xml:space="preserve" textLength="48.344944" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Butan-1-ol.</text>
    <text x="18.054012" y="135.78922" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="36.104034" y="135.78922" xml:space="preserve" textLength="48.34495" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Butan-2-ol.</text>
    <text x="349.656" y="162.97601" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
