<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6787493054653 179.5199837493892" >
    <rect stroke="none" fill="#ffffff" x="-59.28001" y="-652.8202" width="503.34103" height="922.46326" />
    <text x="0.0" y="9.44532" xml:space="preserve" textLength="10.360757" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">9.</text>
    <text x="18.054005" y="9.44532" xml:space="preserve" textLength="354.9891" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">V erlenmajerico s klorovodikovo kislino smo dodali magnezij in na ustje erlenmajerice</text>
    <text x="18.054005" y="23.305311" xml:space="preserve" textLength="342.6755" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">poveznili balonček. Balonček se je napihnil, erlenmajerica pa se je segrela. Katera</text>
    <text x="18.06337" y="37.295197" xml:space="preserve" textLength="282.18625" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">trditev je pravilna za kemijsko reakcijo, ki je potekla v erlenmajerici?</text>
    <text x="18.06337" y="51.151493" xml:space="preserve" textLength="168.35834" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Obkroži črko pred pravilnim odgovorom.</text>
    <text x="18.054005" y="78.34932" xml:space="preserve" textLength="8.830345" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">A</text>
    <text x="36.10882" y="78.34932" xml:space="preserve" textLength="230.7901" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Produkta reakcije sta magnezij in klorovodikova kislina.</text>
    <text x="18.063395" y="102.115135" xml:space="preserve" textLength="8.830345" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">B</text>
    <text x="36.11821" y="102.115135" xml:space="preserve" textLength="251.49121" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Erlenmajerica se je segrela, ker se pri reakciji veže energija.</text>
    <text x="18.063421" y="125.88095" xml:space="preserve" textLength="9.337082" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">C</text>
    <text x="36.118237" y="125.88095" xml:space="preserve" textLength="246.90244" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Pri reakciji nastaja plin, ki je v zmesi s kisikom eksploziven.</text>
    <text x="18.063421" y="149.7682" xml:space="preserve" textLength="9.337082" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">D</text>
    <text x="36.118237" y="149.7682" xml:space="preserve" textLength="287.49762" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Balonček se je napihnil, ker so reaktanti spremenili agregatno stanje.</text>
    <text x="349.656" y="176.8213" xml:space="preserve" textLength="39.022724" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">(1 točka)</text>
</svg>