    <rect stroke="none" fill="#ffffff" x="-60.282" y="-265.20776" width="483.00897" height="922.46326" />
    <text x="0.0" y="9.393976" xml:space="preserve" textLength="15.599574" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">12.</text>
    <text x="18.054005" y="9.393976" xml:space="preserve" textLength="325.27158" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Koliko veznih elektronskih parov je v molekuli, ki jo prikazuje shema? Obkroži.</text>
    <text x="18.050283" y="92.02738" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="36.100307" y="92.02738" xml:space="preserve" textLength="121.05364" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Dva vezna elektronska para.</text>
    <text x="18.05029" y="115.784805" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="36.10031" y="115.784805" xml:space="preserve" textLength="131.96017" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Šest veznih elektronskih parov.</text>
    <text x="18.05029" y="139.6147" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.10031" y="139.6147" xml:space="preserve" textLength="104.44562" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">En vezni elektronski par.</text>
    <text x="18.050295" y="163.4446" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="36.10032" y="163.4446" xml:space="preserve" textLength="142.86671" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Sedem veznih elektronskih parov.</text>
    <text x="349.656" y="187.26399" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
