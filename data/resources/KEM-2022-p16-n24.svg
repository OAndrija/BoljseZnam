<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6787493054653 244.72800060462941" >
    <rect stroke="none" fill="#ffffff" x="-59.28001" y="-87.99221" width="503.34103" height="922.46326" />
    <text x="0.0" y="9.445337" xml:space="preserve" textLength="15.562759" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">24.</text>
    <text x="18.054005" y="9.445337" xml:space="preserve" textLength="352.85904" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Pri tabornikih si morajo udeleženci tabora oprati oblačila. Na voljo imajo deževnico in</text>
    <text x="18.054005" y="23.305311" xml:space="preserve" textLength="365.9835" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">vodo iz vodovoda. Ker imajo omejeno količino trdega mila, so v zadregi, katero vodo naj</text>
    <text x="18.07276" y="37.16159" xml:space="preserve" textLength="38.005207" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">izberejo.</text>
    <text x="18.054815" y="64.35732" xml:space="preserve" textLength="10.969898" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">a)</text>
    <text x="36.20347" y="64.35732" xml:space="preserve" textLength="202.9759" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">S katero vodo bodo dosegli večji učinek pranja?</text>
    <text x="239.99577" y="64.35732" xml:space="preserve" textLength="147.79778" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">_______________________________</text>
    <text x="349.6478" y="91.41414" xml:space="preserve" textLength="39.018627" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">(1 točka)</text>
    <text x="18.045387" y="119.26031" xml:space="preserve" textLength="10.969898" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">b)</text>
    <text x="36.19404" y="119.26031" xml:space="preserve" textLength="91.45647" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Pojasni svoj odgovor.</text>
    <text x="36.203423" y="157.14961" xml:space="preserve" textLength="351.59003" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">__________________________________________________________________________</text>
