<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6135881708251 151.7340059742928" >
    <rect stroke="none" fill="#ffffff" x="-59.30538" y="-577.4005" width="503.34103" height="922.46326" />
    <text x="0.0" y="9.393976" xml:space="preserve" textLength="15.599574" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">10.</text>
    <text x="18.054005" y="9.393976" xml:space="preserve" textLength="160.59258" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Katera trditev velja za molekulo vode?</text>
    <text x="18.054005" y="23.31998" xml:space="preserve" textLength="168.39531" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Obkroži črko pred pravilnim odgovorom.</text>
    <text x="18.054005" y="50.379986" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="36.104027" y="50.379986" xml:space="preserve" textLength="119.49975" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Molekula vode je nepolarna.</text>
    <text x="18.054005" y="74.209885" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="36.104027" y="74.209885" xml:space="preserve" textLength="235.88217" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">V molekuli vode se atomi povezujejo s kovalentno vezjo.</text>
    <text x="18.054005" y="98.03979" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.104027" y="98.03979" xml:space="preserve" textLength="186.04402" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Molekule vode se povezujejo v ionski kristal.</text>
    <text x="18.054005" y="121.86968" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="36.104027" y="121.86968" xml:space="preserve" textLength="229.13449" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">V molekuli vode je en atom vodika in dva atoma kisika.</text>
    <text x="349.656" y="149.04999" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
</svg>