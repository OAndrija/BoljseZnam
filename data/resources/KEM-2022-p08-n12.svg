    <text x="18.054005" y="9.445304" xml:space="preserve" textLength="346.5996" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Reakcijska shema ponazarja kemijsko reakcijo oksidacije alkohola s kislo raztopino</text>
