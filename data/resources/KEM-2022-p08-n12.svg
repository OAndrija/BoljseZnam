    <text x="18.054815" y="105.409325" xml:space="preserve" textLength="336.7636" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Katera trditev je pravilna za reakcijo oksidacije alkohola s kalijevim dikromatom?</text>
    <text x="18.054783" y="119.265625" xml:space="preserve" textLength="168.35837" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Obkroži črko pred pravilnim odgovorom.</text>
    <text x="18.054796" y="146.32246" xml:space="preserve" textLength="8.830345" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">A</text>
    <text x="36.10961" y="146.32246" xml:space="preserve" textLength="210.98985" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Alkohol metanol se oksidira do metanojske kisline.</text>
    <text x="18.054783" y="170.20972" xml:space="preserve" textLength="8.830345" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">B</text>
    <text x="36.1096" y="170.20972" xml:space="preserve" textLength="269.23636" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Pri oksidaciji nastane najprej metanal in nato metanojska kislina.</text>
    <text x="18.05481" y="193.97552" xml:space="preserve" textLength="9.337082" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">C</text>
    <text x="36.109627" y="193.97552" xml:space="preserve" textLength="152.33047" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Alkohol, ki se oksidira, je butan-1-ol.</text>
    <text x="18.045431" y="217.86278" xml:space="preserve" textLength="9.337082" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">D</text>
    <text x="36.100246" y="217.86278" xml:space="preserve" textLength="195.38426" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Produkt oksidacije etanola je etanojska kislina.</text>
