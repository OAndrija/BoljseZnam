<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6135881708251 176.28599777841555" >
    <rect stroke="none" fill="#ffffff" x="-59.30538" y="-607.7605" width="503.34097" height="922.46326" />
    <text x="0.0" y="9.39401" xml:space="preserve" textLength="10.397572" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">3.</text>
    <text x="18.054005" y="9.39401" xml:space="preserve" textLength="348.73178" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">V plavalnih bazenih zaznamo značilen vonj po kloru. S kloriranjem vode preprečimo</text>
    <text x="18.054005" y="23.320013" xml:space="preserve" textLength="169.31932" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">razvoj zdravju škodljivih bakterij in glivic.</text>
    <text x="18.054005" y="37.245953" xml:space="preserve" textLength="192.77312" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Katero od spodaj zapisanih lastnosti ima klor?</text>
    <text x="18.054018" y="51.171886" xml:space="preserve" textLength="168.39532" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Obkroži črko pred pravilnim odgovorom.</text>
    <text x="18.054005" y="78.23201" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="36.104027" y="78.23201" xml:space="preserve" textLength="113.26529" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Je trdna snov, ki sublimira.</text>
    <text x="18.054005" y="102.06191" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="36.104027" y="102.06191" xml:space="preserve" textLength="152.79051" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Je strupen plin, ki draži oči in dihala.</text>
    <text x="18.05398" y="125.89181" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.104004" y="125.89181" xml:space="preserve" textLength="126.77947" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Pri sobnih pogojih je tekočina.</text>
    <text x="18.053991" y="149.72171" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="36.104015" y="149.72171" xml:space="preserve" textLength="186.60399" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Je snov, ki pospešuje rast mikroorganizmov.</text>
    <text x="349.656" y="173.602" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
</svg>