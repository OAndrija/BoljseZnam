    <text x="-0.009896087" y="363.22278" xml:space="preserve" textLength="15.595444" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">20.</text>
    <text x="18.040127" y="363.22278" xml:space="preserve" textLength="10.396962" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">c)</text>
    <text x="36.14615" y="363.22278" xml:space="preserve" textLength="351.78857" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Po reakciji smo ugotovili, da je masni delež raztopine v epruveti 0,05. Kolikšno maso</text>
    <text x="36.14615" y="377.08832" xml:space="preserve" textLength="316.47247" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">raztopine bi morali preliti v izparilnico, da bi po segrevanju dobili 5 g trdnega</text>
    <text x="36.14615" y="391.01425" xml:space="preserve" textLength="222.45203" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">preostanka? Obkroži črko pred pravilnim odgovorom.</text>
    <text x="36.14613" y="418.14145" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
