<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6135881708251 519.4199911165233" >
    <rect stroke="none" fill="#ffffff" x="-59.30538" y="-83.324394" width="503.34097" height="922.46326" />
    <text x="0.0" y="9.394043" xml:space="preserve" textLength="15.599574" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">20.</text>
    <text x="18.054005" y="9.394043" xml:space="preserve" textLength="351.27838" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">V epruveto, v kateri je bela, trdna snov, prilijemo razredčeno klorovodikovo kislino. V</text>
    <text x="18.105003" y="23.320013" xml:space="preserve" textLength="368.87735" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">epruveti zašumi in opazimo nastanek plinskih mehurčkov. Ustju epruvete se približamo z</text>
    <text x="18.105003" y="37.24592" xml:space="preserve" textLength="118.50104" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">gorečo trsko. Trska ugasne.</text>
    <text x="0.0" y="64.372025" xml:space="preserve" textLength="15.595444" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">20.</text>
    <text x="18.050024" y="64.372025" xml:space="preserve" textLength="10.900943" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">a)</text>
    <text x="36.156044" y="64.372025" xml:space="preserve" textLength="134.63785" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Zakaj je ugasnila goreča trska?</text>
    <text x="36.156036" y="78.23757" xml:space="preserve" textLength="168.39531" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Obkroži črko pred pravilnim odgovorom.</text>
    <text x="36.100048" y="105.364746" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="54.206062" y="105.364746" xml:space="preserve" textLength="134.02188" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Zaradi porabe kisika pri reakciji.</text>
    <text x="36.10006" y="129.19461" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="54.206074" y="129.19461" xml:space="preserve" textLength="151.25992" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Zaradi nastanka kalcijevega klorida.</text>
    <text x="36.10006" y="153.02448" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="54.206074" y="153.02448" xml:space="preserve" textLength="158.47427" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Zaradi nastanka ogljikovega dioksida.</text>
    <text x="36.10006" y="176.85434" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="54.206074" y="176.85434" xml:space="preserve" textLength="152.2772" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Zaradi klora iz klorovodikove kisline.</text>
    <text x="349.6422" y="204.04195" xml:space="preserve" textLength="38.95593" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
    <text x="-0.018663788" y="231.76096" xml:space="preserve" textLength="15.595444" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">20.</text>
    <text x="18.031359" y="231.76096" xml:space="preserve" textLength="10.900943" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">b)</text>
    <text x="36.137383" y="231.76096" xml:space="preserve" textLength="244.70183" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Uredi kemijsko enačbo za reakcijo, ki je potekla v epruveti.</text>
    <text x="37.578674" y="260.51718" xml:space="preserve" textLength="25.796494" lengthAdjust="spacingAndGlyphs" style="font-size: 11.229668px;">CaCO</text>
    <text x="63.40142" y="263.08127" xml:space="preserve" textLength="3.8641176" lengthAdjust="spacingAndGlyphs" style="font-size: 8.383815px;">3</text>
    <text x="67.16325" y="260.51752" xml:space="preserve" textLength="58.762127" lengthAdjust="spacingAndGlyphs" style="font-size: 11.229668px;">(s) +   HCl(aq)</text>
