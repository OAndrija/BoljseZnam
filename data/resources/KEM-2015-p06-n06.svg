    <rect stroke="none" fill="#ffffff" x="-59.30538" y="-486.3205" width="503.34097" height="922.46326" />
    <text x="0.0" y="9.393976" xml:space="preserve" textLength="10.397572" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">6.</text>
    <text x="18.054005" y="9.393976" xml:space="preserve" textLength="358.05896" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Atom elementa lahko sprejme dva elektrona. V kateri skupini periodnega sistema je ta</text>
    <text x="18.054005" y="23.31998" xml:space="preserve" textLength="209.45116" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">element? Obkroži črko pred pravilnim odgovorom.</text>
    <text x="18.054005" y="50.445984" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="36.104027" y="50.445984" xml:space="preserve" textLength="66.4883" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">V drugi skupini.</text>
    <text x="18.04468" y="74.27589" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="36.094704" y="74.27589" xml:space="preserve" textLength="64.91102" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">V šesti skupini.</text>
    <text x="18.035347" y="98.10578" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.085373" y="98.10578" xml:space="preserve" textLength="60.832493" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">V peti skupini.</text>
    <text x="18.026009" y="121.935684" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="36.076035" y="121.935684" xml:space="preserve" textLength="70.622826" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">V sedmi skupini.</text>
    <text x="349.656" y="145.74997" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
