<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6135881708251 279.17997583866054" >
    <rect stroke="none" fill="#ffffff" x="-59.30538" y="-88.07647" width="503.34103" height="922.46326" />
    <text x="0.0" y="9.393976" xml:space="preserve" textLength="15.599574" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">18.</text>
    <text x="18.054005" y="9.393976" xml:space="preserve" textLength="354.4391" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">V prvo epruveto damo 5 mL destilirane vode in v drugo epruveto 5 mL vode iz kraške</text>
    <text x="18.054005" y="23.319946" xml:space="preserve" textLength="355.50977" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">jame. V vsako od epruvet dodamo po 5 kapljic milnice in ju enako stresamo 1 minuto.</text>
    <text x="0.0" y="50.44592" xml:space="preserve" textLength="15.595444" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">18.</text>
    <text x="18.050024" y="50.44592" xml:space="preserve" textLength="10.9102745" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">a)</text>
    <text x="36.156044" y="50.44592" xml:space="preserve" textLength="161.62695" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">V kateri epruveti bo nastalo več pene?</text>
    <text x="36.156044" y="88.26211" xml:space="preserve" textLength="154.64777" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">________________________________</text>
    <text x="349.6515" y="113.86746" xml:space="preserve" textLength="38.955906" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
    <text x="0.0" y="154.13193" xml:space="preserve" textLength="15.595444" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">18.</text>
    <text x="18.050024" y="154.13193" xml:space="preserve" textLength="10.9102745" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">b)</text>
    <text x="36.156044" y="154.13193" xml:space="preserve" textLength="180.3322" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Kaj je konstanta pri tem poskusu? Obkroži.</text>
    <text x="36.156013" y="181.25911" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="54.206036" y="181.25911" xml:space="preserve" textLength="124.10268" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Mesto odvzema vzorca vode.</text>
    <text x="36.156013" y="205.08897" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="54.206036" y="205.08897" xml:space="preserve" textLength="84.65032" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Prostornina milnice.</text>
    <text x="36.146687" y="228.91884" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="54.19671" y="228.91884" xml:space="preserve" textLength="86.79691" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Višina nastale pene.</text>
    <text x="36.146698" y="252.67627" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="54.196724" y="252.67627" xml:space="preserve" textLength="49.866207" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Vrsta vode.</text>
    <text x="349.656" y="276.49594" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
</svg>