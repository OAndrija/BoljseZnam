<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6135881708251 165.66001030445113" >
    <rect stroke="none" fill="#ffffff" x="-59.30538" y="-667.55646" width="503.34103" height="922.46326" />
    <text x="0.0" y="9.393992" xml:space="preserve" textLength="10.397572" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">4.</text>
    <text x="18.054005" y="9.393992" xml:space="preserve" textLength="366.27496" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Ko piči osa, vbrizga v kožo tekočino, ki ima bazične lastnosti. S čim lahko nevtraliziramo</text>
    <text x="18.054005" y="23.319998" xml:space="preserve" textLength="53.0301" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">to tekočino?</text>
    <text x="18.053999" y="37.245934" xml:space="preserve" textLength="168.39531" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Obkroži črko pred pravilnim odgovorom.</text>
    <text x="18.054005" y="64.37199" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="36.104027" y="64.37199" xml:space="preserve" textLength="38.451958" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">S kisom.</text>
    <text x="18.053999" y="88.12941" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="36.104023" y="88.12941" xml:space="preserve" textLength="104.94026" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Z milom za pranje perila.</text>
    <text x="18.053999" y="111.95931" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.104023" y="111.95931" xml:space="preserve" textLength="63.37109" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Z jedilno sodo.</text>
    <text x="18.053999" y="135.78922" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="36.104023" y="135.78922" xml:space="preserve" textLength="41.04654" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Z apnico.</text>
    <text x="349.656" y="162.97601" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
</svg>