    <rect stroke="none" fill="#ffffff" x="-60.282" y="-87.733795" width="483.00897" height="922.46326" />
    <text x="0.0" y="9.393976" xml:space="preserve" textLength="15.599574" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">26.</text>
    <text x="18.054005" y="9.393976" xml:space="preserve" textLength="318.08057" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Magnezij gori z belim svetlečim plamenom. Pri tem nastane bela trdna snov.</text>
    <text x="0.0" y="36.519947" xml:space="preserve" textLength="15.595444" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">26.</text>
    <text x="18.050024" y="36.519947" xml:space="preserve" textLength="10.9102745" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">a)</text>
    <text x="36.156044" y="36.519947" xml:space="preserve" textLength="157.45514" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Uredi enačbo za to kemijsko reakcijo.</text>
    <text x="36.156044" y="63.574684" xml:space="preserve" textLength="47.00471" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Mg(s)  +  O</text>
    <text x="83.130005" y="64.70194" xml:space="preserve" textLength="3.3176537" lengthAdjust="spacingAndGlyphs" style="font-size: 6.9498px;">2</text>
    <text x="86.495995" y="63.57992" xml:space="preserve" textLength="89.34479" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(g)                 MgO(s)</text>
    <text x="349.6586" y="92.88112" xml:space="preserve" textLength="38.95593" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
    <text x="-0.0022697449" y="135.64926" xml:space="preserve" textLength="15.595444" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">26.</text>
    <text x="18.047754" y="135.64926" xml:space="preserve" textLength="10.9102745" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">b)</text>
    <text x="36.153774" y="135.64926" xml:space="preserve" textLength="328.37946" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Produkt, ki nastane pri gorenju magnezija, raztopimo v vodi. V vodno raztopino</text>
    <text x="36.153774" y="149.57516" xml:space="preserve" textLength="293.49942" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">uvajamo vodikov klorid. Katera vrsta kemijske reakcije pri tem poteče?</text>
