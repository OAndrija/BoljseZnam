<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6135881708251 165.6599935197828" >
    <rect stroke="none" fill="#ffffff" x="-59.30538" y="-673.9585" width="503.34097" height="922.46326" />
    <text x="0.0" y="9.393992" xml:space="preserve" textLength="10.397572" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">7.</text>
    <text x="18.054005" y="9.393992" xml:space="preserve" textLength="356.51108" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Eksperimentalno smo preverili električno prevodnost vodne raztopine kuhinjske soli in</text>
    <text x="18.054005" y="23.31998" xml:space="preserve" textLength="190.22514" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">vodne raztopine sladkorja. Kaj smo ugotovili?</text>
    <text x="18.054005" y="37.185528" xml:space="preserve" textLength="168.39531" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Obkroži črko pred pravilnim odgovorom.</text>
    <text x="18.054005" y="64.30599" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="36.104027" y="64.30599" xml:space="preserve" textLength="193.33308" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Raztopina kuhinjske soli prevaja električni tok.</text>
    <text x="18.04468" y="88.13589" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="36.094704" y="88.13589" xml:space="preserve" textLength="175.1244" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Raztopina sladkorja prevaja električni tok.</text>
    <text x="18.035355" y="111.96579" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.085377" y="111.96579" xml:space="preserve" textLength="156.43037" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Obe raztopini prevajata električni tok.</text>
    <text x="18.035355" y="135.79568" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="36.085377" y="135.79568" xml:space="preserve" textLength="198.54092" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Nobena raztopina ne prevaja električnega toka.</text>
    <text x="349.656" y="162.976" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
</svg>