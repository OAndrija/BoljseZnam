<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6135881708251 153.44995297193418" >
    <rect stroke="none" fill="#ffffff" x="-60.282" y="-87.733795" width="483.00897" height="922.46326" />
    <text x="0.0" y="9.393976" xml:space="preserve" textLength="10.397572" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">5.</text>
    <text x="18.054005" y="9.393976" xml:space="preserve" textLength="363.28943" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">V 10 mL 5-% klorovodikove kisline smo dodali indikator iz izvlečka rdečega zelja. Vanjo</text>
    <text x="18.054005" y="23.319946" xml:space="preserve" textLength="322.76312" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">smo po kapljicah dodajali 12 mL vodne raztopine natrijevega hidroksida z isto</text>
    <text x="18.044666" y="37.24585" xml:space="preserve" textLength="352.8527" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">koncentracijo. Katero zaporedje spreminjanja barve indikatorja smo opazili? Obkroži.</text>
    <text x="18.054005" y="64.23996" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="36.104027" y="64.23996" xml:space="preserve" textLength="174.66054" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Iz rdeče v rumenozeleno in nato v modro.</text>
    <text x="18.054018" y="85.88372" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="36.104042" y="85.88372" xml:space="preserve" textLength="183.4401" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Iz rdeče v vijoličasto in nato v modrozeleno.</text>
    <text x="18.054005" y="107.46713" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.104027" y="107.46713" xml:space="preserve" textLength="186.60397" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Iz modrozelene v modro in nato v vijoličasto.</text>
    <text x="18.054005" y="129.11089" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="36.104027" y="129.11089" xml:space="preserve" textLength="174.65396" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Iz rdeče v rumeno in nato v modrozeleno.</text>
    <text x="349.656" y="150.76593" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
</svg>