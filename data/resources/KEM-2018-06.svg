<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6135881708251 165.59399620389922" >
    <rect stroke="none" fill="#ffffff" x="-60.240147" y="-452.61682" width="503.34103" height="922.4632" />
    <text x="0.0" y="9.393976" xml:space="preserve" textLength="10.397572" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">6.</text>
    <text x="18.054005" y="9.393976" xml:space="preserve" textLength="359.0755" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">V reagenčni steklenici je v petroleju shranjen košček natrija. Zakaj natrij shranjujemo v</text>
    <text x="18.054005" y="23.25395" xml:space="preserve" textLength="43.65045" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">petroleju?</text>
    <text x="18.054005" y="37.179886" xml:space="preserve" textLength="168.39531" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Obkroži črko pred pravilnim odgovorom.</text>
    <text x="18.054005" y="64.30596" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="36.104027" y="64.30596" xml:space="preserve" textLength="151.2599" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Da ne pride v stik s kisikom in vodo.</text>
    <text x="18.05398" y="88.13586" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="36.104004" y="88.13586" xml:space="preserve" textLength="101.841705" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Da ne izhlapi iz posode.</text>
    <text x="18.053991" y="111.96576" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.104015" y="111.96576" xml:space="preserve" textLength="66.525604" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Da ne razpade.</text>
    <text x="18.053991" y="135.79565" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="36.104015" y="135.79565" xml:space="preserve" textLength="49.85689" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Da ne rjavi.</text>
    <text x="349.656" y="162.90997" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
</svg>