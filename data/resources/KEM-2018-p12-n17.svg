<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6135881708251 355.07999426841707" >
    <rect stroke="none" fill="#ffffff" x="-60.240147" y="-84.534775" width="503.34103" height="922.4632" />
    <text x="0.0" y="9.394043" xml:space="preserve" textLength="15.599574" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">17.</text>
    <text x="18.054005" y="9.394043" xml:space="preserve" textLength="320.63058" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Magnezij gori z belim svetlečim plamenom. Pri tem nastane bela trdna snov.</text>
    <text x="18.050024" y="36.520016" xml:space="preserve" textLength="10.9102745" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">a)</text>
    <text x="36.156044" y="36.520016" xml:space="preserve" textLength="194.91971" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Napiši urejeno enačbo za to kemijsko reakcijo.</text>
    <text x="352.76874" y="202.1213" xml:space="preserve" textLength="35.848064" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(2 točki)</text>
    <text x="18.050035" y="229.91277" xml:space="preserve" textLength="10.900943" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">b)</text>
    <text x="36.15606" y="229.91277" xml:space="preserve" textLength="333.60794" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Produkt, ki nastane pri gorenju magnezija, raztopimo v vodi. Kaj velja za nastalo</text>
    <text x="36.156063" y="243.83867" xml:space="preserve" textLength="74.31866" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">vodno raztopino?</text>
    <text x="36.15607" y="270.8934" xml:space="preserve" textLength="198.99825" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">pH vodne raztopine je _________________ od 7.</text>
    <text x="36.15611" y="298.08096" xml:space="preserve" textLength="256.09738" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Če v vodno raztopino uvajamo vodikov klorid, poteče reakcija</text>
    <text x="36.15611" y="325.20816" xml:space="preserve" textLength="122.0383" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">_________________________.</text>
    <text x="352.76703" y="352.39603" xml:space="preserve" textLength="35.84656" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(2 točki)</text>
</svg>