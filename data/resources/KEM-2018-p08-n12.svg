<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6135881708251 312.31202153968843" >
    <rect stroke="none" fill="#ffffff" x="-60.240147" y="-524.22675" width="503.34103" height="922.4632" />
    <text x="0.0" y="9.39401" xml:space="preserve" textLength="15.599574" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">12.</text>
    <text x="18.054005" y="9.39401" xml:space="preserve" textLength="357.50357" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Dobro si oglej shemo, ki ponazarja porazdelitev elektronov v atomu nekega elementa.</text>
    <text x="18.05217" y="156.041" xml:space="preserve" textLength="335.26917" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Atom tega elementa lahko odda 3 elektrone. Nastane delec, ki ima enako število</text>
    <text x="18.05217" y="169.96693" xml:space="preserve" textLength="344.5557" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">elektronov kakor eden izmed žlahtnih plinov. O katerem žlahtnem plinu govorimo?</text>
    <text x="18.061502" y="183.83249" xml:space="preserve" textLength="168.39531" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Obkroži črko pred pravilnim odgovorom.</text>
    <text x="18.061502" y="210.95969" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="36.111526" y="210.95969" xml:space="preserve" textLength="28.549643" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Heliju.</text>
    <text x="18.052164" y="234.78958" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="36.10219" y="234.78958" xml:space="preserve" textLength="32.7215" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Neonu.</text>
    <text x="18.052164" y="258.61948" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.10219" y="258.61948" xml:space="preserve" textLength="35.3254" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Argonu.</text>
    <text x="18.052164" y="282.44937" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="36.10219" y="282.44937" xml:space="preserve" textLength="40.019897" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Kriptonu.</text>
    <text x="349.656" y="309.62802" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
