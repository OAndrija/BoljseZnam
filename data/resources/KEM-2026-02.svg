<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6135881708251 151.6679918737409" >
    <rect stroke="none" fill="#ffffff" x="-59.30538" y="-270.10446" width="503.34103" height="922.46326" />
    <text x="0.0" y="9.393976" xml:space="preserve" textLength="10.397572" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">2.</text>
    <text x="18.054005" y="9.393976" xml:space="preserve" textLength="358.59067" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Celično dihanje je energijski proces, pri katerem iz glukoze in kisika nastaneta ogljikov</text>
    <text x="18.054005" y="23.319946" xml:space="preserve" textLength="244.23528" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">dioksid in voda. Kaj velja za to kemijsko reakcijo? Obkroži.</text>
    <text x="18.054005" y="50.445984" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="36.104027" y="50.445984" xml:space="preserve" textLength="194.40637" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Ogljikov dioksid in voda sta reaktanta reakcije.</text>
    <text x="18.054005" y="74.27585" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="36.104027" y="74.27585" xml:space="preserve" textLength="212.98923" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Je eksotermna, ker se energija pri reakciji sprošča.</text>
    <text x="18.054005" y="98.03327" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.104027" y="98.03327" xml:space="preserve" textLength="248.47246" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Energija pri celičnem dihanju se ne veže in tudi ne sprošča.</text>
    <text x="18.054031" y="121.863174" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="36.104053" y="121.863174" xml:space="preserve" textLength="190.69643" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Masa reaktantov je večja od mase produktov.</text>
    <text x="349.656" y="148.98398" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
</svg>