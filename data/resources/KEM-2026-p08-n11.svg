<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6135881708251 134.441987472057" >
    <rect stroke="none" fill="#ffffff" x="-60.282" y="-87.733795" width="483.00897" height="922.46326" />
    <text x="0.0" y="9.393976" xml:space="preserve" textLength="15.599574" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">11.</text>
    <text x="18.054005" y="9.393976" xml:space="preserve" textLength="235.97057" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Kaj velja za vodno raztopino kalijevega sulfida? Obkroži.</text>
    <text x="18.054005" y="36.519947" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="36.104027" y="36.519947" xml:space="preserve" textLength="335.21335" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">V vodni raztopini so polarne molekule vode, kovinski kationi in nekovinski anioni.</text>
    <text x="18.044641" y="60.34981" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="36.094666" y="60.34981" xml:space="preserve" textLength="276.50882" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">V vodni raztopini se prosto gibljejo kalijevi anioni in sulfidni kationi.</text>
    <text x="18.035328" y="84.10723" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.08535" y="84.10723" xml:space="preserve" textLength="312.80557" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Vodna raztopina je zmes dveh spojin, katerih gradniki so polarne molekule.</text>
    <text x="18.035328" y="107.9371" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="36.08535" y="107.9371" xml:space="preserve" textLength="280.073" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Vodna raztopina prevaja električni tok zaradi gibljivih molekul vode.</text>
    <text x="349.656" y="131.75797" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
</svg>