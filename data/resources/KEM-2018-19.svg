    <rect stroke="none" fill="#ffffff" x="-59.30538" y="-83.324394" width="503.34103" height="922.46326" />
    <text x="0.0" y="9.394043" xml:space="preserve" textLength="15.599574" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">19.</text>
    <text x="18.054005" y="9.394043" xml:space="preserve" textLength="189.66255" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Slika prikazuje model molekule ogljikovodika.</text>
    <text x="18.048965" y="99.94095" xml:space="preserve" textLength="10.900943" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">a)</text>
    <text x="36.154987" y="99.94095" xml:space="preserve" textLength="283.74182" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Napiši strukturno ali racionalno formulo molekule tega ogljikovodika.</text>
    <text x="349.65045" y="251.61635" xml:space="preserve" textLength="38.955906" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
    <text x="18.039608" y="293.33377" xml:space="preserve" textLength="10.9102745" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">b)</text>
    <text x="36.14563" y="293.33377" xml:space="preserve" textLength="190.40253" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Poimenuj ogljikovodik, ki ga prikazuje model.</text>
    <text x="225.9135" y="293.33377" xml:space="preserve" textLength="161.94646" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">__________________________________</text>
    <text x="349.6411" y="320.46094" xml:space="preserve" textLength="38.95593" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
    <text x="18.03027" y="362.17838" xml:space="preserve" textLength="10.396962" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">c)</text>
    <text x="36.13629" y="362.17838" xml:space="preserve" textLength="349.24066" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">S katero od navedenih snovi bo pri sobnih pogojih reagiral ta ogljikovodik: s helijem,</text>
    <text x="36.13629" y="376.1043" xml:space="preserve" textLength="210.4778" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">ogljikovim dioksidom, raztopino broma, metanom?</text>
    <text x="36.13629" y="403.159" xml:space="preserve" textLength="102.08435" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Ogljikovodik bo reagiral</text>
    <text x="136.75536" y="403.159" xml:space="preserve" textLength="199.50249" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">__________________________________________</text>
    <text x="334.73627" y="403.159" xml:space="preserve" textLength="5.198468" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">.</text>
    <text x="349.656" y="430.34204" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
