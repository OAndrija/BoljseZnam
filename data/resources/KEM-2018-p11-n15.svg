    <text x="0.0" y="9.393976" xml:space="preserve" textLength="15.599574" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">15.</text>
    <text x="18.054005" y="9.393976" xml:space="preserve" textLength="370.43082" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Pri uri kemije so učenci ugotavljali trdoto vode. Uporabili so tri različne vzorce vode: vodo</text>
    <text x="18.054005" y="23.319946" xml:space="preserve" textLength="358.50824" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">iz pipe, mineralno vodo in destilirano vodo. V epruvete so nalili po 5 mL posameznega</text>
    <text x="18.054005" y="37.24585" xml:space="preserve" textLength="358.02304" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">vzorca vode, v vsako epruveto dodali 2 mL milnice in vsebino dobro pretresli. Spodnja</text>
    <text x="18.063343" y="51.171753" xml:space="preserve" textLength="227.56639" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">preglednica prikazuje višino nastale pene v epruvetah.</text>
    <text x="100.313736" y="83.90797" xml:space="preserve" textLength="49.343555" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">1. epruveta</text>
    <text x="174.21243" y="83.90797" xml:space="preserve" textLength="49.343475" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">2. epruveta</text>
    <text x="248.15778" y="83.90797" xml:space="preserve" textLength="49.343475" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">3. epruveta</text>
