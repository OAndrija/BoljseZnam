    <text x="0.0" y="9.394043" xml:space="preserve" textLength="15.599574" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">13.</text>
    <text x="18.054005" y="9.394043" xml:space="preserve" textLength="207.86957" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Iz sheme je razvidna porazdelitev delcev v snovi.</text>
    <text x="18.047228" y="161.71686" xml:space="preserve" textLength="10.900943" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">a)</text>
    <text x="36.153248" y="161.71686" xml:space="preserve" textLength="280.56854" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">O kateri spremembi snovi sklepaš iz porazdelitve delcev na shemi?</text>
    <text x="36.153255" y="199.53305" xml:space="preserve" textLength="351.81702" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">__________________________________________________________________________</text>
    <text x="349.64874" y="229.55894" xml:space="preserve" textLength="38.95593" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
    <text x="18.037897" y="271.2763" xml:space="preserve" textLength="10.900943" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">b)</text>
    <text x="36.143917" y="271.2763" xml:space="preserve" textLength="332.54395" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Snov ohladimo pod temperaturo tališča. Nariši, kakšna bo razporeditev delcev v</text>
    <text x="36.143917" y="285.14185" xml:space="preserve" textLength="27.019037" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">snovi.</text>
    <text x="349.656" y="417.93405" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
