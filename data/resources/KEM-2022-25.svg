<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6787493054653 347.8199873971935" >
    <rect stroke="none" fill="#ffffff" x="-59.28001" y="-371.52826" width="503.34103" height="922.46326" />
    <text x="0.0" y="9.445304" xml:space="preserve" textLength="15.562759" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">25.</text>
    <text x="18.054005" y="9.445304" xml:space="preserve" textLength="350.29706" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Zrak je zmes plinov. Plina A je v zraku 78,084 % in se v tekočem agregatnem stanju</text>
    <text x="18.054005" y="23.437305" xml:space="preserve" textLength="353.5299" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">uporablja v živilski industriji za hitro zmrzovanje. Plina B pa je v zraku 20,947 % in se</text>
    <text x="18.063383" y="37.29362" xml:space="preserve" textLength="336.314" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">uporablja tudi pri mehanski ventilaciji bolnikov s covidom-19 v intenzivni terapiji v</text>
    <text x="18.054005" y="51.149933" xml:space="preserve" textLength="151.22318" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">bolnišnicah. Odgovori na vprašanja.</text>
    <text x="18.054815" y="84.685295" xml:space="preserve" textLength="10.969898" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">a)</text>
    <text x="36.20347" y="84.685295" xml:space="preserve" textLength="351.58997" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Poimenuj plin A.  ___________________________________________________________</text>
    <text x="349.6478" y="111.74212" xml:space="preserve" textLength="39.018627" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">(1 točka)</text>
    <text x="18.045387" y="139.58832" xml:space="preserve" textLength="10.969898" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">b)</text>
    <text x="36.19404" y="139.58832" xml:space="preserve" textLength="318.08093" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Napiši strukturno formulo molekule plina B, v kateri so prikazani tudi nevezni</text>
    <text x="36.203403" y="153.44463" xml:space="preserve" textLength="68.09031" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">elektronski pari.</text>
    <text x="349.6478" y="235.53807" xml:space="preserve" textLength="39.018654" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">(1 točka)</text>
    <text x="18.045387" y="263.38428" xml:space="preserve" textLength="10.35994" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">c)</text>
    <text x="36.20343" y="263.38428" xml:space="preserve" textLength="346.69855" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Poimenuj plin, ki se lahko uporablja kot anestetik, znan tudi kot smejalni plin, in ima</text>
    <text x="36.20343" y="277.24057" xml:space="preserve" textLength="40.1138" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">formulo A</text>
    <text x="76.296" y="278.32928" xml:space="preserve" textLength="3.2893014" lengthAdjust="spacingAndGlyphs" style="font-size: 6.8904px;">2</text>
    <text x="79.560005" y="277.27332" xml:space="preserve" textLength="11.382797" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">B.</text>
    <text x="36.21531" y="315.28403" xml:space="preserve" textLength="154.52637" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">________________________________</text>
    <text x="349.656" y="345.1213" xml:space="preserve" textLength="39.022724" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">(1 točka)</text>
</svg>