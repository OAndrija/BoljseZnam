<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6135881708251 151.66795830440424" >
    <rect stroke="none" fill="#ffffff" x="-59.30538" y="-88.07647" width="503.34103" height="922.46326" />
    <text x="0.0" y="9.393976" xml:space="preserve" textLength="15.599574" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">15.</text>
    <text x="18.054005" y="9.393976" xml:space="preserve" textLength="369.584" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Razporeditev elektronov v atomu nekega elementa je 2, 8, 7, v njegovem ionu pa 2, 8, 8.</text>
    <text x="18.054005" y="23.319946" xml:space="preserve" textLength="195.88934" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Obkroži pravilno trditev o neznanem elementu.</text>
    <text x="18.054005" y="50.44592" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="36.104027" y="50.44592" xml:space="preserve" textLength="208.33768" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Atomi elementa imajo osem valenčnih elektronov.</text>
    <text x="18.054005" y="74.20334" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="36.104027" y="74.20334" xml:space="preserve" textLength="262.39526" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Element je kovina, ki sodi v osmo skupino periodnega sistema.</text>
    <text x="18.054005" y="98.0332" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.104027" y="98.0332" xml:space="preserve" textLength="203.73936" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Iz atomov elementa nastanejo nekovinski anioni.</text>
    <text x="18.05398" y="121.86307" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="36.104004" y="121.86307" xml:space="preserve" textLength="166.23656" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Atomi elementa tvorijo ione z nabojem 1</text>
    <text x="202.36801" y="118.02992" xml:space="preserve" textLength="3.48472" lengthAdjust="spacingAndGlyphs" style="font-size: 6.9498px;">+</text>
    <text x="205.836" y="121.85797" xml:space="preserve" textLength="5.2451344" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">.</text>
    <text x="349.656" y="148.98393" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
</svg>