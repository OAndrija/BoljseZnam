    <text x="0.0" y="9.393976" xml:space="preserve" textLength="10.397572" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">6.</text>
    <text x="18.054005" y="9.393976" xml:space="preserve" textLength="364.79593" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Pri nadzoru prometa policisti pogosto preverjajo vinjenost voznikov. Katero snov pri tem</text>
    <text x="18.054005" y="23.319946" xml:space="preserve" textLength="206.79314" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">preverjanju določajo v izdihanem zraku? Obkroži.</text>
