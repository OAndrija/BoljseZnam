    <rect stroke="none" fill="#ffffff" x="-60.282" y="-498.18777" width="483.00897" height="922.46326" />
    <text x="0.0" y="9.39401" xml:space="preserve" textLength="15.599574" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">13.</text>
    <text x="18.054005" y="9.39401" xml:space="preserve" textLength="361.1376" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Nekateri pridelovalci zelenjave v želji po čim večjem pridelku uporabljajo velike količine</text>
    <text x="18.054005" y="23.320013" xml:space="preserve" textLength="334.68872" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">sredstev proti plevelu. Katere škodljive snovi so nakopičene v zelenjavi, ki je bila</text>
    <text x="18.054005" y="37.245953" xml:space="preserve" textLength="131.4842" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">čezmerno škropljena? Obkroži.</text>
    <text x="18.054005" y="64.30599" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="36.104027" y="64.30599" xml:space="preserve" textLength="34.31744" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Gnojila.</text>
    <text x="18.054005" y="88.13589" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="36.104027" y="88.13589" xml:space="preserve" textLength="29.628536" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Nitrati.</text>
    <text x="18.054005" y="111.96579" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.104027" y="111.96579" xml:space="preserve" textLength="57.67794" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Ogljikovodiki.</text>
    <text x="18.054005" y="135.79568" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="36.104027" y="135.79568" xml:space="preserve" textLength="40.029236" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Pesticidi.</text>
