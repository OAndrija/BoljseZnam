<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6787493054653 160.1160007848739" >
    <rect stroke="none" fill="#ffffff" x="-59.28001" y="-679.6162" width="503.34103" height="922.46326" />
    <text x="0.0" y="9.445337" xml:space="preserve" textLength="10.360757" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">3.</text>
    <text x="18.054005" y="9.445337" xml:space="preserve" textLength="331.60425" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Klor je reaktiven element, ki v naravi ni v elementarnem stanju. Njegove spojine</text>
    <text x="18.054005" y="23.305344" xml:space="preserve" textLength="344.19003" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">uporabljamo v različne namene. V kateri trditvi so naštete samo snovi, ki vsebujejo</text>
    <text x="18.063395" y="37.29523" xml:space="preserve" textLength="238.5319" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">klorove spojine? Obkroži črko pred pravilnim odgovorom.</text>
    <text x="18.054005" y="64.35735" xml:space="preserve" textLength="8.830345" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">A</text>
    <text x="36.10882" y="64.35735" xml:space="preserve" textLength="219.86713" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Razkužilo za rane, razkužilo za bazene, tekoče milo.</text>
    <text x="18.054005" y="87.06664" xml:space="preserve" textLength="8.830345" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">B</text>
    <text x="36.10882" y="87.06664" xml:space="preserve" textLength="196.92325" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Kuhinjska sol, polivinil klorid, razkužilo za rane.</text>
    <text x="18.063408" y="109.77592" xml:space="preserve" textLength="9.337082" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">C</text>
    <text x="36.118225" y="109.77592" xml:space="preserve" textLength="208.85033" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Kuhinjska sol, polivinil klorid, razkužilo za bazene.</text>
    <text x="18.063421" y="132.4852" xml:space="preserve" textLength="9.337082" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">D</text>
    <text x="36.118237" y="132.4852" xml:space="preserve" textLength="244.24677" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Barva za lase, kuhinjska sol, odstranjevalec laka za nohte.</text>
    <text x="349.656" y="157.41734" xml:space="preserve" textLength="39.022724" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">(1 točka)</text>
</svg>