<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6787493054653 179.52000053405754" >
    <rect stroke="none" fill="#ffffff" x="-59.28001" y="-434.49225" width="503.34103" height="922.46326" />
    <text x="0.0" y="9.445304" xml:space="preserve" textLength="10.360757" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">8.</text>
    <text x="18.054005" y="9.445304" xml:space="preserve" textLength="358.17953" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">V epruveto smo nalili 5 mL vode z gostoto 0,999 g/mL, nato pa dodali 5 mL heksana z</text>
    <text x="18.054005" y="23.305311" xml:space="preserve" textLength="369.5549" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">gostoto 0,659 g/mL. V zmes smo dali še kristalček joda. Vsebino smo dobro premešali in</text>
    <text x="18.044615" y="37.295197" xml:space="preserve" textLength="212.60193" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">ugotovili, da sta nastali dve plasti. Kaj smo opazili?</text>
    <text x="18.044601" y="51.151512" xml:space="preserve" textLength="168.35835" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Obkroži črko pred pravilnim odgovorom.</text>
    <text x="18.054005" y="78.21729" xml:space="preserve" textLength="8.830345" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">A</text>
    <text x="36.10882" y="78.21729" xml:space="preserve" textLength="207.93063" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Zgornja plast je voda, ki se je obarvala vijoličasto.</text>
    <text x="18.053953" y="102.10453" xml:space="preserve" textLength="8.830345" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">B</text>
    <text x="36.10877" y="102.10453" xml:space="preserve" textLength="210.4831" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Spodnja plast je voda, ki se je obarvala vijoličasto.</text>
    <text x="18.053926" y="125.870346" xml:space="preserve" textLength="9.337082" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">C</text>
    <text x="36.10874" y="125.870346" xml:space="preserve" textLength="212.53821" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Zgornja plast je heksan, ki se je obarval vijoličasto.</text>
    <text x="18.072708" y="149.75758" xml:space="preserve" textLength="9.337082" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">D</text>
    <text x="36.127525" y="149.75758" xml:space="preserve" textLength="215.18451" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Spodnja plast je heksan, ki se je obarval vijoličasto.</text>
    <text x="349.656" y="176.8213" xml:space="preserve" textLength="39.022724" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">(1 točka)</text>
</svg>