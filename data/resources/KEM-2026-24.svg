    <text x="36.156044" y="126.27992" xml:space="preserve" textLength="264.53455" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Kako se spreminjata tališče in vrelišče teh elementov? Obkroži.</text>
    <text x="36.156036" y="148.98656" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="54.206062" y="148.98656" xml:space="preserve" textLength="127.26382" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Naraščata po skupini navzdol.</text>
    <text x="36.156036" y="172.81642" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="54.206062" y="172.81642" xml:space="preserve" textLength="114.319916" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Padata po skupini navzdol.</text>
    <text x="36.15605" y="196.64629" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="54.206074" y="196.64629" xml:space="preserve" textLength="169.84938" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Naraščata s padajočim vrstnim številom.</text>
    <text x="36.15605" y="220.40372" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="54.206074" y="220.40372" xml:space="preserve" textLength="196.40361" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Padata z naraščajočo relativno atomsko maso.</text>
