<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6787493054653 201.300054717065" >
    <rect stroke="none" fill="#ffffff" x="-59.28001" y="-320.18018" width="503.34103" height="922.46326" />
    <text x="0.0" y="9.445337" xml:space="preserve" textLength="15.562759" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">11.</text>
    <text x="18.054005" y="9.445337" xml:space="preserve" textLength="361.3266" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Učenci so v čaši pripravili 200 g 10 % vodne raztopine neznane snovi. V raztopini se je</text>
    <text x="18.054005" y="23.437372" xml:space="preserve" textLength="345.65686" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">moder lakmusov papir obarval rdeče. Kateri opis pravilno navaja postopek priprave</text>
    <text x="18.054031" y="37.29365" xml:space="preserve" textLength="46.2453" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">raztopine?</text>
    <text x="18.054031" y="51.28354" xml:space="preserve" textLength="168.35834" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Obkroži črko pred pravilnim odgovorom.</text>
    <text x="18.054005" y="78.34936" xml:space="preserve" textLength="84.20264" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">V čašo so natehtali:</text>
    <text x="18.04462" y="102.115166" xml:space="preserve" textLength="8.830345" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">A</text>
    <text x="36.099438" y="102.115166" xml:space="preserve" textLength="150.71643" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">20 g citronske kisline in 200 g vode.</text>
    <text x="18.044615" y="126.0024" xml:space="preserve" textLength="8.830345" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">B</text>
    <text x="36.09943" y="126.0024" xml:space="preserve" textLength="122.16089" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">20 g sladkorja in 180 g vode.</text>
    <text x="18.053991" y="149.76822" xml:space="preserve" textLength="9.337082" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">C</text>
    <text x="36.108807" y="149.76822" xml:space="preserve" textLength="150.70705" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">20 g citronske kisline in 180 g vode.</text>
    <text x="18.044588" y="173.65546" xml:space="preserve" textLength="9.337082" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">D</text>
    <text x="36.099403" y="173.65546" xml:space="preserve" textLength="188.25241" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">20 g natrijevega klorida in dodali 200 g vode.</text>
    <text x="349.656" y="198.60136" xml:space="preserve" textLength="39.022724" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">(1 točka)</text>
</svg>