    <text x="18.054005" y="9.39401" xml:space="preserve" textLength="362.66946" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">V epruveti smo premešali 5 mL heksana in 5 mL vode ter dodali kristalček joda. Temna</text>
    <text x="18.054005" y="23.254017" xml:space="preserve" textLength="342.45578" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">plast v epruveti ustreza vijoličnemu obarvanju heksana po dodatku kristalčka joda.</text>
    <text x="18.050024" y="50.38002" xml:space="preserve" textLength="10.900943" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">a)</text>
    <text x="36.156044" y="50.38002" xml:space="preserve" textLength="304.05048" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Katera shema prikazuje rezultat tega poskusa? Obkroži črko pod shemo.</text>
