    <text x="18.054005" y="9.445337" xml:space="preserve" textLength="369.56918" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">V tabeli so podana opažanja, kako se je spremenila barva rdečega lakmusovega papirja,</text>
