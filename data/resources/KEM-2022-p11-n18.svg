    <text x="36.21286" y="285.72134" xml:space="preserve" textLength="346.80728" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Katera snov, snov 1 ali snov 2, je lahko vodna raztopina jedilne sode ali natrijevega</text>
