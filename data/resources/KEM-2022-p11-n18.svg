    <text x="36.20347" y="170.48534" xml:space="preserve" textLength="342.4878" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Na katero lastnost snovi 2 lahko sklepamo na podlagi opažanj? Odgovor utemelji.</text>
