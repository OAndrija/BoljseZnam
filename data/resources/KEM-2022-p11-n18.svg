    <text x="36.20347" y="123.35556" xml:space="preserve" textLength="351.59018" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Kolikšna je lahko pH vrednost vodne raztopine v čaši 1?  ________________________</text>
