    <rect stroke="none" fill="#ffffff" x="-59.30538" y="-411.54245" width="503.34103" height="922.46326" />
    <text x="0.0" y="9.39401" xml:space="preserve" textLength="15.599574" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">19.</text>
    <text x="18.054005" y="9.39401" xml:space="preserve" textLength="303.49457" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Dana kemijska enačba predstavlja kemijsko reakcijo med kislino in bazo.</text>
    <text x="18.050024" y="39.62202" xml:space="preserve" textLength="91.69671" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">HBr(aq)  +  LiOH(aq)</text>
    <text x="109.80301" y="39.62202" xml:space="preserve" textLength="11.882997" lengthAdjust="spacingAndGlyphs" style="font-size: 13.840199px;">→</text>
    <text x="121.686005" y="39.62202" xml:space="preserve" textLength="61.066708" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">LiBr(aq)  +  H</text>
    <text x="182.733" y="40.74401" xml:space="preserve" textLength="3.3176408" lengthAdjust="spacingAndGlyphs" style="font-size: 6.9498px;">2</text>
    <text x="186.04799" y="39.62202" xml:space="preserve" textLength="18.152668" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">O(l)</text>
    <text x="0.003968811" y="81.33944" xml:space="preserve" textLength="15.595444" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">19.</text>
    <text x="18.053991" y="81.33944" xml:space="preserve" textLength="10.9102745" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">a)</text>
    <text x="36.160015" y="81.33944" xml:space="preserve" textLength="300.9426" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Kako imenujemo sol, ki jo dobimo pri tej reakciji, ko odparimo vso vodo?</text>
    <text x="36.160034" y="119.22815" xml:space="preserve" textLength="154.64774" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">________________________________</text>
    <text x="349.6555" y="144.8335" xml:space="preserve" textLength="38.95593" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
    <text x="0.0" y="185.08601" xml:space="preserve" textLength="15.595444" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">19.</text>
    <text x="18.050024" y="185.08601" xml:space="preserve" textLength="10.9102745" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">b)</text>
    <text x="36.156044" y="185.08601" xml:space="preserve" textLength="280.08334" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Poimenuj reaktant, v katerem rdeč lakmusov papir spremeni barvo.</text>
    <text x="36.156063" y="222.90224" xml:space="preserve" textLength="154.64774" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">________________________________</text>
    <text x="349.65155" y="248.5076" xml:space="preserve" textLength="38.95593" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
    <text x="0.0" y="288.838" xml:space="preserve" textLength="15.595444" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">19.</text>
    <text x="18.050024" y="288.838" xml:space="preserve" textLength="10.396962" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">c)</text>
    <text x="36.156044" y="288.838" xml:space="preserve" textLength="341.95175" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">S katero raztopino bi še lahko nevtralizirali kislino pri tej kemijski reakciji? Obkroži.</text>
    <text x="36.165375" y="315.89276" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="54.2154" y="315.89276" xml:space="preserve" textLength="111.174675" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">S sokom stisnjene limone.</text>
    <text x="36.165363" y="339.72263" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="54.215385" y="339.72263" xml:space="preserve" textLength="146.56541" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Z vodno raztopino sode bikarbone.</text>
    <text x="36.156013" y="363.55255" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="54.206036" y="363.55255" xml:space="preserve" textLength="141.31094" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Z ekstraktom listov rdečega zelja.</text>
    <text x="36.146687" y="387.38242" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="54.19671" y="387.38242" xml:space="preserve" textLength="190.17747" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">S čistilom za odstranjevanje vodnega kamna.</text>
    <text x="349.656" y="411.20203" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
