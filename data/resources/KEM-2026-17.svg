    <text x="0.0" y="9.393976" xml:space="preserve" textLength="15.599574" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">17.</text>
    <text x="18.054005" y="9.393976" xml:space="preserve" textLength="284.72656" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Živosrebrov oksid segrevamo. Pri tem nastaneta živo srebro in kisik.</text>
    <text x="0.0" y="36.519947" xml:space="preserve" textLength="26.51505" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">17. a)</text>
    <text x="36.156036" y="36.519947" xml:space="preserve" textLength="145.45477" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Napiši kemijsko formulo reaktanta.</text>
    <text x="36.16535" y="74.33614" xml:space="preserve" textLength="154.64774" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">________________________________</text>
    <text x="349.66083" y="104.301674" xml:space="preserve" textLength="38.95593" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
    <text x="-3.8909915E-5" y="147.14232" xml:space="preserve" textLength="15.595444" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">17.</text>
    <text x="18.049984" y="147.14232" xml:space="preserve" textLength="10.9102745" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">b)</text>
    <text x="36.156006" y="147.14232" xml:space="preserve" textLength="276.4621" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Poimenuj vrsto kemijske reakcije glede na energijske spremembe.</text>
    <text x="36.155987" y="185.03102" xml:space="preserve" textLength="154.64774" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">________________________________</text>
    <text x="349.65143" y="214.99657" xml:space="preserve" textLength="38.95593" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
    <text x="-0.009429169" y="257.82507" xml:space="preserve" textLength="15.595444" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">17.</text>
    <text x="18.040594" y="257.82507" xml:space="preserve" textLength="10.396962" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">c)</text>
    <text x="36.146614" y="257.82507" xml:space="preserve" textLength="170.9992" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Zapiši urejeno enačbo kemijske reakcije.</text>
    <text x="36.14661" y="295.6413" xml:space="preserve" textLength="351.81702" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">__________________________________________________________________________</text>
    <text x="349.6421" y="325.60678" xml:space="preserve" textLength="38.95593" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
