    <text x="18.031256" y="368.44748" xml:space="preserve" textLength="10.9102745" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">d)</text>
    <text x="36.137276" y="368.44748" xml:space="preserve" textLength="340.39478" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Pri segrevanju 22,0 g živosrebrovega oksida nastane 20,4 g živega srebra. Koliko</text>
    <text x="36.137276" y="382.3734" xml:space="preserve" textLength="100.82441" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">gramov kisika nastane?</text>
