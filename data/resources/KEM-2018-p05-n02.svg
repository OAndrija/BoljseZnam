<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6135881708251 165.6599935197828" >
    <rect stroke="none" fill="#ffffff" x="-59.30538" y="-273.40445" width="503.34103" height="922.46326" />
    <text x="0.0" y="9.393976" xml:space="preserve" textLength="10.397572" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">2.</text>
    <text x="18.054005" y="9.393976" xml:space="preserve" textLength="342.00757" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Fosfor in žveplo sta v tretji periodi periodnega sistema. Kaj imata atoma fosforja in</text>
    <text x="18.054005" y="23.319946" xml:space="preserve" textLength="77.9492" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">žvepla skupnega?</text>
    <text x="18.054005" y="37.24585" xml:space="preserve" textLength="168.39531" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Obkroži črko pred pravilnim odgovorom.</text>
    <text x="18.054005" y="64.30596" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="36.104027" y="64.30596" xml:space="preserve" textLength="103.92292" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Imata v jedru tri protone.</text>
    <text x="18.054005" y="88.135826" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="36.104027" y="88.135826" xml:space="preserve" textLength="108.608086" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Imata v jedru tri nevtrone.</text>
    <text x="18.054005" y="111.96572" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.104027" y="111.96572" xml:space="preserve" textLength="149.68265" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Imata na zunanji lupini tri elektrone.</text>
    <text x="18.054005" y="135.79562" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="36.104027" y="135.79562" xml:space="preserve" textLength="180.33221" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Imata elektrone razporejene v treh lupinah.</text>
    <text x="349.656" y="162.97597" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
</svg>