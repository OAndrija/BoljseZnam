<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6787493054653 517.0440206060412" >
    <rect stroke="none" fill="#ffffff" x="-59.28001" y="-87.99215" width="503.34103" height="922.46326" />
    <text x="0.0" y="9.445404" xml:space="preserve" textLength="15.562759" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">21.</text>
    <text x="18.054005" y="9.445404" xml:space="preserve" textLength="275.45877" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Podana je razporeditev elektronov v 4 atomih različnih elementov.</text>
    <text x="18.054005" y="36.50538" xml:space="preserve" textLength="70.74598" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Element 1: 2,8,2</text>
    <text x="18.054005" y="60.271194" xml:space="preserve" textLength="70.74598" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Element 2: 2,8,1</text>
    <text x="18.054005" y="84.15846" xml:space="preserve" textLength="70.74598" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Element 3: 2,8,6</text>
    <text x="18.054005" y="107.92428" xml:space="preserve" textLength="62.89157" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Element 4: 2,8</text>
    <text x="17.847555" y="145.66783" xml:space="preserve" textLength="10.969898" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">a)</text>
    <text x="36.20266" y="145.66783" xml:space="preserve" textLength="207.93066" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Atomi katerega elementa imajo stabilno zgradbo?</text>
    <text x="36.20264" y="183.55713" xml:space="preserve" textLength="95.87632" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">____________________</text>
    <text x="349.64703" y="213.51636" xml:space="preserve" textLength="39.018654" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">(1 točka)</text>
    <text x="17.83816" y="241.36252" xml:space="preserve" textLength="10.969898" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">b)</text>
    <text x="36.19326" y="241.36252" xml:space="preserve" textLength="320.69803" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Atomi katerega elementa sprejmejo elektrone, da pridobijo stabilno zgradbo?</text>
    <text x="36.193287" y="279.2518" xml:space="preserve" textLength="95.87632" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">____________________</text>
    <text x="349.63763" y="309.0896" xml:space="preserve" textLength="39.018627" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">(1 točka)</text>
    <text x="17.828768" y="336.9358" xml:space="preserve" textLength="10.35994" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">c)</text>
    <text x="36.183872" y="336.9358" xml:space="preserve" textLength="345.12927" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Zgradba katerih atomov je značilna za element, ki sodi v drugo periodo periodnega</text>
    <text x="36.287094" y="350.7921" xml:space="preserve" textLength="85.71819" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">sistema elementov?</text>
    <text x="36.183872" y="388.80286" xml:space="preserve" textLength="95.876335" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">____________________</text>
    <text x="349.62823" y="418.64066" xml:space="preserve" textLength="39.018654" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">(1 točka)</text>
    <text x="17.819378" y="446.48685" xml:space="preserve" textLength="10.969898" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">d)</text>
    <text x="36.17448" y="446.48685" xml:space="preserve" textLength="222.36603" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Atomi katerega elementa imajo en valenčni elektron?</text>
    <text x="36.17448" y="484.37613" xml:space="preserve" textLength="95.876335" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">____________________</text>
    <text x="349.656" y="514.3454" xml:space="preserve" textLength="39.022724" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">(1 točka)</text>
</svg>