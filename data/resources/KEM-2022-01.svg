    <text x="19.76038" y="110.05734" xml:space="preserve" textLength="26.589478" lengthAdjust="spacingAndGlyphs" style="font-size: 10.280557px;">nanos</text>
    <text x="21.23954" y="123.76477" xml:space="preserve" textLength="21.159988" lengthAdjust="spacingAndGlyphs" style="font-size: 10.280557px;">črnila</text>
    <path stroke="#000000" fill="none" d="M79.924065,143.61935 L46.3007,115.904045 " />
    <text x="80.334694" y="149.29056" xml:space="preserve" textLength="5.907783" lengthAdjust="spacingAndGlyphs" style="font-size: 10.280557px;">X</text>
    <text x="18.054815" y="203.21768" xml:space="preserve" textLength="295.76492" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Kaj poskus pove o tem črnilu? Obkroži črko pred pravilnim odgovorom.</text>
    <text x="18.064173" y="230.40811" xml:space="preserve" textLength="8.830345" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">A</text>
    <text x="36.118988" y="230.40811" xml:space="preserve" textLength="83.69591" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Črnilo je čista snov.</text>
    <text x="18.06418" y="253.11737" xml:space="preserve" textLength="8.830345" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">B</text>
    <text x="36.118996" y="253.11737" xml:space="preserve" textLength="277.49426" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Črnilo je zmes treh snovi, ki so obarvane modro, oranžno in rdeče.</text>
    <text x="18.064173" y="275.82666" xml:space="preserve" textLength="9.337082" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">C</text>
    <text x="36.118988" y="275.82666" xml:space="preserve" textLength="317.06662" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Črnilo je rdeče barve, ker je rdeče obarvana snov najviše na kromatogramu.</text>
    <text x="18.054783" y="298.53595" xml:space="preserve" textLength="9.337082" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">D</text>
    <text x="36.1096" y="298.53595" xml:space="preserve" textLength="323.8137" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Črnilo je modre barve, ker je modro obarvana snov najniže na kromatogramu.</text>
    <text x="349.656" y="321.22937" xml:space="preserve" textLength="39.022724" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">(1 točka)</text>
</svg>