    <text x="0.0" y="9.445404" xml:space="preserve" textLength="10.360757" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">1.</text>
    <text x="18.054005" y="9.445404" xml:space="preserve" textLength="319.62476" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Na spodnji sliki je kromatogram, ki smo ga dobili pri ločevanju barvil v črnilu.</text>
