<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6135881708251 151.73398918962448" >
    <rect stroke="none" fill="#ffffff" x="-59.30538" y="-477.41046" width="503.34103" height="922.46326" />
    <text x="0.0" y="9.39401" xml:space="preserve" textLength="10.397572" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">3.</text>
    <text x="18.054005" y="9.39401" xml:space="preserve" textLength="219.85458" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Katera trditev velja za reaktante pri kemijski reakciji?</text>
    <text x="18.054005" y="23.254017" xml:space="preserve" textLength="168.39531" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Obkroži črko pred pravilnim odgovorom.</text>
    <text x="18.054005" y="50.38002" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="36.104027" y="50.38002" xml:space="preserve" textLength="190.7011" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Masa reaktantov je večja od mase produktov.</text>
    <text x="18.054005" y="74.20992" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="36.104027" y="74.20992" xml:space="preserve" textLength="204.21523" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Reaktanti so vedno v trdnem agregatnem stanju.</text>
    <text x="18.054005" y="98.03982" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.104027" y="98.03982" xml:space="preserve" textLength="218.78416" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Pri kemijski reakciji iz reaktantov nastanejo produkti.</text>
    <text x="18.054005" y="121.86972" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="36.104027" y="121.86972" xml:space="preserve" textLength="264.0024" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Reaktanti so v kemijski enačbi zapisani na desni strani enačbe.</text>
    <text x="349.656" y="149.05" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
</svg>