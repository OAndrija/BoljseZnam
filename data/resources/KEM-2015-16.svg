    <text x="18.054056" y="37.24585" xml:space="preserve" textLength="319.60858" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Izbiraš lahko med naslednjimi elementi: kalij, klor, ogljik, vodik, aluminij, helij.</text>
