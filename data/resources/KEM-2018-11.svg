    <text x="51.786255" y="67.8255" xml:space="preserve" textLength="23.726357" lengthAdjust="spacingAndGlyphs" style="font-size: 10.812186px;">(g), O</text>
    <text x="75.51103" y="69.485504" xml:space="preserve" textLength="3.3543718" lengthAdjust="spacingAndGlyphs" style="font-size: 7.026723px;">2</text>
    <text x="78.8664" y="67.82537" xml:space="preserve" textLength="11.345573" lengthAdjust="spacingAndGlyphs" style="font-size: 10.812186px;">(g)</text>
