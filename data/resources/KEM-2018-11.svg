    <text x="134.1074" y="189.38739" xml:space="preserve" textLength="18.566319" lengthAdjust="spacingAndGlyphs" style="font-size: 10.812186px;">O(g)</text>
    <text x="18.051878" y="259.0131" xml:space="preserve" textLength="255.61209" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Kaj lahko sklepamo iz energijskega diagrama za to reakcijo?</text>
    <text x="18.051878" y="272.939" xml:space="preserve" textLength="168.39531" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Obkroži črko pred pravilnim odgovorom.</text>
    <text x="18.051878" y="300.06616" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">A</text>
    <text x="36.101902" y="300.06616" xml:space="preserve" textLength="155.31046" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Sežig vodika je endotermna reakcija.</text>
    <text x="18.051878" y="323.89606" xml:space="preserve" textLength="8.819684" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">B</text>
    <text x="36.101902" y="323.89606" xml:space="preserve" textLength="159.53822" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Pri sežigu vodika se sprošča energija.</text>
    <text x="18.051878" y="347.72595" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">C</text>
    <text x="36.101902" y="347.72595" xml:space="preserve" textLength="212.60574" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Energija produktov je večja od energije reaktantov.</text>
    <text x="18.042566" y="371.48337" xml:space="preserve" textLength="9.323665" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">D</text>
    <text x="36.09259" y="371.48337" xml:space="preserve" textLength="179.25893" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Pri reakciji nastaneta iz vode vodik in kisik.</text>
    <text x="349.656" y="398.66202" xml:space="preserve" textLength="38.957565" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">(1 točka)</text>
