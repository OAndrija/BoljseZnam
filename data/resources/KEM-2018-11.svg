    <text x="0.0" y="9.394043" xml:space="preserve" textLength="15.599574" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">11.</text>
    <text x="18.054005" y="9.394043" xml:space="preserve" textLength="336.68192" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">Sežig vodika je lahko vir energije za pogon vozil. Na sliki je energijski diagram, ki</text>
    <text x="18.054005" y="23.320013" xml:space="preserve" textLength="215.62956" lengthAdjust="spacingAndGlyphs" style="font-size: 10.8702px;">ponazarja energijsko spremembo pri sežigu vodika.</text>
