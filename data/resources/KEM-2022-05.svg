<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 388.6787493054653 151.66802544307757" >
    <rect stroke="none" fill="#ffffff" x="-59.28001" y="-278.4682" width="503.34103" height="922.46326" />
    <text x="0.0" y="9.445337" xml:space="preserve" textLength="10.360757" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">5.</text>
    <text x="18.054005" y="9.445337" xml:space="preserve" textLength="343.6761" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Vrstno število elementa je 11, njegovo masno število pa 23. Kaj velja za atom tega</text>
    <text x="18.054005" y="23.305311" xml:space="preserve" textLength="214.66838" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">elementa? Obkroži črko pred pravilnim odgovorom.</text>
    <text x="18.054005" y="50.497345" xml:space="preserve" textLength="8.830345" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">A</text>
    <text x="36.10882" y="50.497345" xml:space="preserve" textLength="125.2107" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">V jedru atoma je 23 protonov.</text>
    <text x="18.053991" y="74.26316" xml:space="preserve" textLength="8.830345" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">B</text>
    <text x="36.108807" y="74.26316" xml:space="preserve" textLength="189.78204" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">V elektronski ovojnici atoma je 12 elektronov.</text>
    <text x="18.053991" y="98.02898" xml:space="preserve" textLength="9.337082" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">C</text>
    <text x="36.108807" y="98.02898" xml:space="preserve" textLength="203.75479" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">Vsota protonov in nevtronov v jedru atoma je 23.</text>
    <text x="18.05398" y="121.916214" xml:space="preserve" textLength="9.337082" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">D</text>
    <text x="36.108795" y="121.916214" xml:space="preserve" textLength="175.18988" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">V atomu je 11 elektronov in 11 nevtronov.</text>
    <text x="349.656" y="148.96933" xml:space="preserve" textLength="39.022724" lengthAdjust="spacingAndGlyphs" style="font-size: 10.9296px;">(1 točka)</text>
</svg>